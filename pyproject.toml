[project]
name = "effigov-takehome"
version = "0.1.0"
description = "Emma311 take-home: voice intake agent, FastAPI case backend, Next.js dashboard"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "livekit-agents[openai,silero]>=1.0",
    "livekit-api>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
